<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園遊會線上點餐系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC_ariYuuW3a-DKyO20ZFwbFlvb2SZm_0",
      authDomain: "garden-order-afeab.firebaseapp.com",
      projectId: "garden-order-afeab",
      storageBucket: "garden-order-afeab.firebasestorage.app",
      messagingSenderId: "387401732851",
      appId: "1:387401732851:web:68acf7d633e0fdff079d86",
      measurementId: "G-BWG1EE20BH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth).catch(err => console.error("Firebase 匿名登入失敗:", err));

    window.db = db;
    window.appId = firebaseConfig.projectId;
    window.fs = { collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, getDocs, setDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_MENU = [
      { id: 'p1', name: '甜不辣', category: '關東煮', price: 25, icon: '🍢', desc: '1個 / 口感Q彈入味。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p2', name: '高麗菜捲', category: '蔬菜', price: 40, icon: '🥬', desc: '1個 / 清甜高麗菜包裹肉餡。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p3', name: '蛋餃', category: '關東煮', price: 35, icon: '🥟', desc: '2個 / 金黃蛋皮包覆內餡。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p4', name: '貢丸', category: '關東煮', price: 35, icon: '🍡', desc: '3個 / 紮實彈牙。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p5', name: '竹輪', category: '關東煮', price: 35, icon: '🍥', desc: '2個 / 吸飽湯汁超入味。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p6', name: '豬血糕', category: '關東煮', price: 25, icon: '🪵', desc: '1個 / 軟糯入味。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p7', name: '蘿蔔', category: '蔬菜', price: 20, icon: '🥕', desc: '1個 / 燉煮至透亮綿密。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p8', name: '玉米', category: '蔬菜', price: 25, icon: '🌽', desc: '1個 / 鮮甜金黃玉米。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p9', name: '王子麵', category: '主食', price: 25, icon: '🍜', desc: '1個 / 填飽肚子首選！', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p10', name: '仁甫套餐', category: '套餐', price: 75, icon: '🍱', desc: '高麗菜捲*1 + 蘿蔔*1 + 玉米*1', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p11', name: '呷飽飽套餐', category: '套餐', price: 150, icon: '🍲', desc: '貢丸*3 + 蛋餃*2 + 玉米*1 + 高麗菜捲*1 + 王子麵*1', options: ['原味高湯', '麻辣湯底'], isSoldOut: false }
    ];

    function App() {
      const [view, setView] = useState('customer');
      const [menu, setMenu] = useState(INITIAL_MENU);
      const [cart, setCart] = useState([]);
      const [orders, setOrders] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('全部');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedOptions, setSelectedOptions] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // 監聽雲端資料
      useEffect(() => {
        if (!window.db || !window.fs) return;
        const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
        const menuRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'menu_status');

        const unsubOrders = window.fs.onSnapshot(ordersRef, (snapshot) => {
          const fetched = snapshot.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
          fetched.sort((a, b) => (Number(a.seq?.replace(/\D/g,'')) || 0) - (Number(b.seq?.replace(/\D/g,'')) || 0));
          setOrders(fetched);
        });

        const unsubMenu = window.fs.onSnapshot(menuRef, (snapshot) => {
          const map = {};
          snapshot.docs.forEach(doc => { map[doc.id] = doc.data().isSoldOut; });
          setMenu(prev => prev.map(item => ({ ...item, isSoldOut: map[item.id] !== undefined ? map[item.id] : false })));
        });

        return () => { unsubOrders(); unsubMenu(); };
      }, []);

      const toggleSoldOut = async (itemId) => {
        if (!window.db || !window.fs) return;
        const target = menu.find(i => i.id === itemId);
        if (!target) return;
        try {
          const ref = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'menu_status', itemId);
          await window.fs.setDoc(ref, { isSoldOut: !target.isSoldOut }, { merge: true });
        } catch (e) { console.error(e); }
      };

      const submitOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0 || isSubmitting) return;
        setIsSubmitting(true);
        try {
          const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
          const snapshot = await window.fs.getDocs(ordersRef);
          const seq = '#' + String(snapshot.size + 1).padStart(3, '0');
          const newOrder = {
            id: 'ORD-' + Date.now().toString().slice(-4),
            seq,
            customerName: customerName || '貴賓',
            phone: customerPhone || '未提供',
            items: cart,
            total: cart.reduce((s, i) => s + i.price, 0),
            status: 'pending',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            createdAt: Date.now()
          };
          const docRef = await window.fs.addDoc(ordersRef, newOrder);
          setActiveOrder({ ...newOrder, firestoreId: docRef.id });
          setCart([]);
        } catch (err) {
          console.error(err);
          alert("送出失敗");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 pb-20">
          <header className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-6">
            <h1 className="text-xl font-black text-amber-700">🍢 園遊會點餐系統</h1>
            <div className="flex gap-2">
              <button onClick={() => setView('customer')} className={`px-3 py-1.5 rounded-xl font-bold text-xs ${view === 'customer' ? 'bg-amber-500 text-white' : 'bg-amber-100 text-amber-800'}`}>顧客點餐</button>
              <button onClick={() => setView('kitchen')} className={`px-3 py-1.5 rounded-xl font-bold text-xs ${view === 'kitchen' ? 'bg-amber-500 text-white' : 'bg-amber-100 text-amber-800'}`}>賣家接單</button>
            </div>
          </header>

          {view === 'customer' ? (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="md:col-span-2 space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  {menu.map(item => (
                    <div key={item.id} className={`bg-white p-4 rounded-2xl border ${item.isSoldOut ? 'opacity-60 bg-slate-100' : ''}`}>
                      <div className="text-2xl">{item.icon}</div>
                      <h3 className="font-bold text-sm">{item.name} {item.isSoldOut && <span className="text-red-500 text-xs">(已售罄)</span>}</h3>
                      <p className="text-xs text-slate-400">{item.desc}</p>
                      <div className="flex justify-between items-center mt-3">
                        <span className="font-bold text-amber-600">${item.price}</span>
                        <button 
                          disabled={item.isSoldOut}
                          onClick={() => setCart([...cart, { cartId: Math.random(), ...item, options: ['原味高湯'] }])}
                          className="bg-amber-500 disabled:bg-slate-300 text-white text-xs font-bold px-3 py-1.5 rounded-xl"
                        >
                          加入
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-md space-y-3">
                <h2 className="font-bold text-sm">🛒 購物車 ({cart.length})</h2>
                {cart.map(i => (
                  <div key={i.cartId} className="flex justify-between text-xs bg-amber-50 p-2 rounded-lg">
                    <span>{i.icon} {i.name}</span>
                    <span className="font-bold">${i.price}</span>
                  </div>
                ))}
                {cart.length > 0 && (
                  <form onSubmit={submitOrder} className="space-y-2 pt-2 border-t">
                    <input type="text" placeholder="稱呼" value={customerName} onChange={e => setCustomerName(e.target.value)} required className="w-full text-xs p-2 border rounded-lg" />
                    <input type="tel" placeholder="手機末三碼" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} required className="w-full text-xs p-2 border rounded-lg" />
                    <button type="submit" disabled={isSubmitting} className="w-full bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl">送出訂單</button>
                  </form>
                )}
                {activeOrder && <div className="bg-amber-500 text-white p-3 rounded-xl text-xs">您的序號：<span className="text-lg font-mono font-bold">{activeOrder.seq}</span></div>}
              </div>
            </div>
          ) : (
            <div className="space-y-4">
              <div className="bg-white p-4 rounded-2xl shadow-md">
                <h3 className="text-xs font-bold text-slate-600 mb-2">🛠️ 點擊按鈕即時切換售罄狀態：</h3>
                <div className="flex flex-wrap gap-2">
                  {menu.map(item => (
                    <button
                      key={item.id}
                      onClick={() => toggleSoldOut(item.id)}
                      className={`text-xs font-bold px-3 py-2 rounded-xl border ${item.isSoldOut ? 'bg-red-500 text-white' : 'bg-emerald-50 text-emerald-700'}`}
                    >
                      {item.icon} {item.name}：{item.isSoldOut ? '已售罄 (點此上架)' : '供應中 (點此售罄)'}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {orders.map(o => (
                  <div key={o.firestoreId} className="bg-white p-4 rounded-2xl shadow-md border">
                    <div className="font-mono text-xl font-black text-amber-600">{o.seq} - {o.customerName}</div>
                    <div className="text-xs text-slate-500 my-1">金額：${o.total}</div>
                    <div className="flex gap-1 mt-2">
                      <button onClick={async () => await window.fs.updateDoc(window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', o.firestoreId), { status: 'ready' })} className="bg-emerald-500 text-white text-xs px-2 py-1 rounded-lg">可取餐</button>
                      <button onClick={async () => await window.fs.updateDoc(window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', o.firestoreId), { status: 'completed' })} className="bg-slate-400 text-white text-xs px-2 py-1 rounded-lg">完成</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
