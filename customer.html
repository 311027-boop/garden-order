<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園遊會線上點餐 - 顧客點餐端</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC_ariYuuW3a-DKyO20ZFwbFlvb2SZm_0",
      authDomain: "garden-order-afeab.firebaseapp.com",
      projectId: "garden-order-afeab",
      storageBucket: "garden-order-afeab.firebasestorage.app",
      messagingSenderId: "387401732851",
      appId: "1:387401732851:web:68acf7d633e0fdff079d86",
      measurementId: "G-BWG1EE20BH"
    };

    const appId = firebaseConfig.projectId;
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Firebase 驗證失敗:", err);
      }
    }

    await initAuth();

    window.db = db;
    window.appId = appId;
    window.fs = { collection, addDoc, doc, onSnapshot, getDocs };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MENU_ITEMS = [
      { id: 'p1', name: '甜不辣', category: '關東煮', price: 25, icon: '🍢', desc: '1個 / 口感Q彈入味，關東煮必點經典選擇。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p2', name: '高麗菜捲', category: '蔬菜', price: 40, icon: '🥬', desc: '1個 / 清甜高麗菜包裹鮮美肉餡，吸滿濃郁湯汁。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p3', name: '蛋餃', category: '關東煮', price: 35, icon: '🥟', desc: '2個 / 金黃蛋皮包覆香濃內餡，香氣十足。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p4', name: '貢丸', category: '關東煮', price: 35, icon: '🍡', desc: '3個 / 紮實彈牙，爆汁鮮美，經典美味。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p5', name: '竹輪', category: '關東煮', price: 35, icon: '🍥', desc: '2個 / 日式經典竹輪，吸飽湯汁超入味。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p6', name: '豬血糕', category: '關東煮', price: 25, icon: '🪵', desc: '1個 / 軟糯入味，吸收湯頭精華，老饕最愛。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p7', name: '蘿蔔', category: '蔬菜', price: 20, icon: '🥕', desc: '1個 / 燉煮至透亮綿密，清甜多汁。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p8', name: '玉米', category: '蔬菜', price: 25, icon: '🌽', desc: '1個 / 鮮甜金黃玉米，顆粒飽滿甜度高。', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p9', name: '王子麵', category: '主食', price: 25, icon: '🍜', desc: '1個 / 吸收麻辣/高湯精華的邪惡主食，填飽肚子首選！', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p10', name: '仁甫套餐', category: '套餐', price: 75, icon: '🍱', desc: '組合包含：高麗菜捲*1 + 蘿蔔*1 + 玉米*1', options: ['原味高湯', '麻辣湯底'] },
      { id: 'p11', name: '呷飽飽套餐', category: '套餐', price: 150, icon: '🍲', desc: '超值澎湃！包含：貢丸*3 + 蛋餃*2 + 玉米*1 + 高麗菜捲*1 + 王子麵*1', options: ['原味高湯', '麻辣湯底'] }
    ];

    function CustomerApp() {
      const [menu] = useState(MENU_ITEMS);
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('全部');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedOptions, setSelectedOptions] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // 即時監聽個人訂單狀態變更
      const [currentOrderId, setCurrentOrderId] = React.useState(() => localStorage.getItem('current_order_id') || '');
      const [order, setOrder] = React.useState(null);

      React.useEffect(() => {
          if (!currentOrderId || !window.db || !window.fs) return;

          const orderRef = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', currentOrderId);
          const unsub = window.fs.onSnapshot(orderRef, (docSnap) => {
              if (docSnap.exists()) {
                  setOrder({ firestoreId: docSnap.id, ...docSnap.data() });
              } else {
                  setOrder(null);
              }
           });

           return () => unsub();
       }, [currentOrderId]);

        return () => {
            unsubs.forEach(unsub => unsub && unsub());
        };
    }, [activeOrder]);

      const openOptionModal = (item) => {
        setSelectedItem(item);
        setSelectedOptions([item.options[0]]);
      };

      const addToCart = () => {
        if (!selectedItem) return;
        const cartItem = {
          cartId: Date.now() + Math.random(),
          id: selectedItem.id,
          name: selectedItem.name,
          price: selectedItem.price,
          icon: selectedItem.icon,
          options: [...selectedOptions]
        };
        setCart([...cart, cartItem]);
        setSelectedItem(null);
      };

      const removeFromCart = (cartId) => {
        setCart(cart.filter(item => item.cartId !== cartId));
      };

      const cartTotalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      const submitOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0 || isSubmitting) return;

        setIsSubmitting(true);

        try {
          let seqNum = 1;
          if (window.db && window.fs) {
            const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
            const snapshot = await window.fs.getDocs(ordersRef);
            seqNum = snapshot.size + 1;
          }

          const formattedSeq = '#' + String(seqNum).padStart(3, '0');

          const newOrder = {
            id: 'ORD-' + Date.now().toString().slice(-4),
            seq: formattedSeq,
            customerName: customerName || '貴賓',
            phone: customerPhone || '未提供',
            items: cart,
            total: cartTotalPrice,
            status: 'pending',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            createdAt: Date.now()
          };

          if (window.db && window.fs) {
            const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
            const docRef = await window.fs.addDoc(ordersRef, newOrder);
            setActiveOrder({ ...newOrder, firestoreId: docRef.id });

            const myOrders = JSON.parse(localStorage.getItem('my_orders') || '[]');
            myOrders.push({ firestoreId: docRef.id });
            localStorage.setItem('my_orders', JSON.stringify(myOrders));
          } else {
            setActiveOrder(newOrder);
          }
          setCart([]);
        } catch (err) {
          console.error("提交訂單失敗:", err);
          alert("訂單送出失敗，請確認網路連線！");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="max-w-md mx-auto p-4 pb-28">
          <header className="bg-white p-4 rounded-2xl shadow-md border-b-4 border-amber-400 mb-5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-4xl animate-bounce">🍢</span>
              <div>
                <h1 className="text-xl font-black text-amber-700">園遊會美食線上點餐</h1>
                <p className="text-xs text-slate-500 font-medium">免桌號 ‧ 掃碼點餐 ‧ 專屬序號取餐</p>
              </div>
            </div>
          </header>

{order ? (
        <div className="mt-6 bg-gradient-to-r from-amber-500 to-amber-600 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden mb-3">
            <div className="flex justify-between items-center mb-3">
                <span className="text-xl font-black bg-white/20 px-3 py-1 rounded-xl font-mono">
                    {order.seq}
                </span>
                <span className="text-xs font-bold bg-white/30 px-3 py-1 rounded-full animate-pulse">
                    {order.status === 'ready' ? '🔔 請前來取餐！' : order.status === 'preparing' ? '⏳ 製作中' : order.status === 'completed' ? '✅ 已取餐' : '⏳ 已收到訂單'}
                </span>
            </div>
            <div className="text-xs space-y-1 mb-3 opacity-90">
                <div>訂購人：{order.customerName} ({order.phone})</div>
                {order.items?.map((it, idx) => (
                    <div key={idx} className="flex justify-between">
                        <span>{it.name}</span>
                        <span>${it.price}</span>
                    </div>
                ))}
            </div>
            <div className="text-right font-bold text-sm border-t border-white/20 pt-2">
                合計：${order.total} 元
            </div>
        </div>
    ) : (
        <div className="mt-6 text-center text-amber-800 py-6 bg-amber-50 rounded-2xl">
            目前沒有進行中的訂單
        </div>
    )}
          <div className="space-y-4">
            <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
              {['全部', '主食', '關東煮', '蔬菜', '套餐'].map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                    selectedCategory === cat 
                      ? 'bg-amber-500 text-white shadow scale-105' 
                      : 'bg-white text-slate-600 hover:bg-amber-100'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 gap-3">
              {menu
                .filter(item => selectedCategory === '全部' || item.category === selectedCategory)
                .map(item => (
                  <div key={item.id} className="bg-white rounded-2xl p-3.5 shadow-sm border border-amber-100 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <span className="text-3xl">{item.icon}</span>
                      <div>
                        <h3 className="font-bold text-slate-800 text-sm">{item.name}</h3>
                        <p className="text-[11px] text-slate-400 leading-tight">{item.desc}</p>
                        <span className="font-extrabold text-amber-600 text-sm mt-1 block">${item.price}</span>
                      </div>
                    </div>
                    <button
                      onClick={() => openOptionModal(item)}
                      className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm active:scale-95 transition-all"
                    >
                      <i className="fa-solid fa-plus mr-1"></i>選購
                    </button>
                  </div>
                ))}
            </div>
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-amber-200 p-3 shadow-2xl z-40 max-w-md mx-auto">
            {cart.length > 0 ? (
              <div className="space-y-2">
                <div className="max-h-28 overflow-y-auto space-y-1">
                  {cart.map(item => (
                    <div key={item.cartId} className="flex justify-between items-center text-xs bg-amber-50 p-1.5 rounded-lg">
                      <span className="font-bold">{item.icon} {item.name} <span className="text-[10px] text-amber-700">({item.options.join('/')})</span></span>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-amber-600">${item.price}</span>
                        <button onClick={() => removeFromCart(item.cartId)} className="text-slate-300 hover:text-red-500">
                          <i className="fa-solid fa-xmark"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={submitOrder} className="space-y-2 pt-1 border-t border-slate-100">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="稱呼 (例: 王小明)"
                      value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)}
                      required
                      className="w-1/2 text-xs px-2.5 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-500"
                    />
                    <input
                      type="tel"
                      placeholder="手機末三碼 (例: 888)"
                      value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value)}
                      required
                      className="w-1/2 text-xs px-2.5 py-1.5 border rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-300 text-white font-extrabold py-2.5 rounded-xl shadow transition-all flex items-center justify-center gap-2 text-sm"
                  >
                    <i className="fa-solid fa-paper-plane"></i> {isSubmitting ? '傳送中...' : `送出訂單 (合計 $${cartTotalPrice} 元)`}
                  </button>
                </form>
              </div>
            ) : (
              <div className="text-center text-xs text-slate-400 py-1 font-medium">
                🛒 購物車目前是空的，請點選上方餐點加購！
              </div>
            )}
          </div>

          {selectedItem && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">{selectedItem.icon}</span>
                    <h3 className="font-extrabold text-sm text-slate-800">{selectedItem.name}</h3>
                  </div>
                  <button onClick={() => setSelectedItem(null)} className="text-slate-400">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-2">選擇湯底：</label>
                  <div className="flex flex-wrap gap-1.5">
                    {selectedItem.options.map(opt => (
                      <button
                        key={opt}
                        onClick={() => setSelectedOptions([opt])}
                        className={`px-3 py-1.5 text-xs rounded-xl font-bold border transition-all ${
                          selectedOptions.includes(opt)
                            ? 'bg-amber-500 text-white border-amber-500 shadow-sm'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-amber-50'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pt-2 border-t flex justify-between items-center">
                  <span className="font-black text-xl text-amber-600">${selectedItem.price}</span>
                  <button
                    onClick={addToCart}
                    className="bg-amber-500 text-white font-bold px-4 py-2 rounded-xl text-xs shadow"
                  >
                    加入購物車
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CustomerApp />);
  </script>
</body>
</html>
