<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園遊會線上點餐 - 賣家接單與叫號端</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC_ariYuuW3a-DKyO20ZFwbFlvb2SZm_0",
      authDomain: "garden-order-afeab.firebaseapp.com",
      projectId: "garden-order-afeab",
      storageBucket: "garden-order-afeab.firebasestorage.app",
      messagingSenderId: "387401732851",
      appId: "1:387401732851:web:68acf7d633e0fdff079d86",
      measurementId: "G-BWG1EE20BH"
    };

    const appId = firebaseConfig.projectId;
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Firebase 驗證失敗:", err);
      }
    }

    await initAuth();

    window.db = db;
    window.appId = appId;
    window.fs = { collection, onSnapshot, updateDoc, doc, deleteDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function SellerApp() {
      const [viewMode, setViewMode] = useState('orders'); // 'orders' | 'display'
      const [orders, setOrders] = useState([]);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showQrModal, setShowQrModal] = useState(false);

      const prevOrderCountRef = useRef(0);
      const qrRef = useRef(null);

      const playBellSound = () => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.6);
        } catch(e){}
      };

      useEffect(() => {
        if (!window.db || !window.fs) return;

        const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');

        const unsub = window.fs.onSnapshot(ordersRef, (snapshot) => {
          const fetched = snapshot.docs.map(docSnap => ({
            firestoreId: docSnap.id,
            ...docSnap.data()
          }));

          fetched.sort((a, b) => {
             const numA = Number(String(a.seq || '').replace(/\D/g, '')) || 0;
             const numB = Number(String(b.seq || '').replace(/\D/g, '')) || 0;
             return numA - numB;
          });

          if (fetched.length > prevOrderCountRef.current && prevOrderCountRef.current !== 0) {
            playBellSound();
          }
          prevOrderCountRef.current = fetched.length;

          setOrders(fetched);
        }, (err) => console.error("賣家監聽訂單錯誤:", err));

        return () => unsub();
      }, [soundEnabled]);

      useEffect(() => {
        if (showQrModal && qrRef.current) {
          qrRef.current.innerHTML = '';
          const customerUrl = window.location.href.replace('seller.html', 'customer.html');
          new QRCode(qrRef.current, {
            text: customerUrl,
            width: 200,
            height: 200,
            colorDark: "#b45309",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }, [showQrModal]);

      const updateOrderStatus = async (firestoreId, nextStatus) => {
        if (!window.db || !window.fs || !firestoreId) return;
        try {
          const orderDocRef = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', firestoreId);
          await window.fs.updateDoc(orderDocRef, { status: nextStatus });
        } catch (err) {
          console.error("更新訂單狀態失敗:", err);
        }
      };

      const clearAllOrders = async () => {
        if (window.confirm("確定要清空所有雲端訂單嗎？")) {
          try {
            for (const ord of orders) {
              if (ord.firestoreId) {
                const orderDocRef = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', ord.firestoreId);
                await window.fs.deleteDoc(orderDocRef);
              }
            }
          } catch(e){
            console.error("清空失敗:", e);
          }
        }
      };

      const completedOrders = orders.filter(o => o.status === 'completed');
      const grandTotalRevenue = completedOrders.reduce((sum, o) => sum + o.total, 0);
      const readyOrders = orders.filter(o => o.status === 'ready');
      const preparingOrders = orders.filter(o => o.status === 'preparing');

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6 pb-20">
          <header className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-md border-b-4 border-amber-400 mb-6 gap-4">
            <div className="flex items-center gap-3">
              <span className="text-4xl">🏪</span>
              <div>
                <h1 className="text-2xl font-black text-amber-700">攤位即時接單與叫號系統</h1>
                <p className="text-xs text-slate-500 font-medium">園遊會賣家後台 ‧ 雲端即時同步 ‧ 叫號看板</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => setShowQrModal(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm"
              >
                <i className="fa-solid fa-qrcode"></i> 印顧客點餐 QR Code
              </button>

              <div className="flex bg-amber-100 p-1 rounded-xl gap-1">
                <button 
                  onClick={() => setViewMode('orders')} 
                  className={`px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition-all ${viewMode === 'orders' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}>
                  <i className="fa-solid fa-list-check mr-1"></i>接單看板
                </button>
                <button 
                  onClick={() => setViewMode('display')} 
                  className={`px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition-all ${viewMode === 'display' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}>
                  <i className="fa-solid fa-bullhorn mr-1"></i>叫號大螢幕
                </button>
              </div>
            </div>
          </header>

          {viewMode === 'orders' && (
            <div className="space-y-6">
              <div className="bg-white p-4 rounded-2xl shadow-md border border-amber-100 flex flex-wrap justify-between items-center gap-4">
                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setSoundEnabled(!soundEnabled)}
                    className={`text-xs px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 ${soundEnabled ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-400'}`}
                  >
                    <i className={`fa-solid ${soundEnabled ? 'fa-bell text-amber-600' : 'fa-bell-slash'}`}></i>
                    {soundEnabled ? '新訂單鈴聲：開啟' : '靜音'}
                  </button>
                  <button 
                    onClick={clearAllOrders}
                    className="text-xs px-3 py-1.5 rounded-lg font-bold bg-red-50 text-red-600 hover:bg-red-100 transition-all"
                  >
                    <i className="fa-solid fa-trash-can mr-1"></i>重置所有訂單
                  </button>
                </div>

                <div className="flex items-center gap-4">
                  <div className="bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200 text-center">
                    <span className="text-xs text-slate-500 block">今日營業總額</span>
                    <span className="text-lg font-black text-amber-600">${grandTotalRevenue}</span>
                  </div>
                  <div className="bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 text-center">
                    <span className="text-xs text-slate-500 block">待取餐筆數</span>
                    <span className="text-lg font-black text-emerald-600">{readyOrders.length} 筆</span>
                  </div>
                </div>
              </div>

              {orders.length === 0 ? (
                <div className="bg-white p-12 rounded-2xl text-center text-slate-400 shadow-sm border border-slate-100">
        <p className="text-4xl mb-2">📋</p>
        <p className="font-bold">目前尚無訂單，等待顧客下單中...</p>
    </div>
) : (
    <div className="space-y-8">
        {/* ================= 上方：進行中訂單區塊 ================= */}
        <div>
            <h3 className="text-lg font-bold text-slate-700 mb-4">進行中訂單 ({activeOrders.length})</h3>
            {activeOrders.length === 0 ? (
                <p className="text-slate-400 text-sm bg-white p-6 rounded-xl border border-slate-100">目前沒有進行中的訂單，大家辛苦了！</p>
            ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {activeOrders.map(order => (
                        <div 
                            key={order.firestoreId} 
                            className={`bg-white text-slate-800 p-5 shadow-md border-2 transition-all flex flex-col justify-between rounded-2xl ${
                                order.status === 'ready' ? 'border-emerald-500 bg-emerald-50/20' : 
                                order.status === 'preparing' ? 'border-amber-400 bg-amber-50/20' : 
                                'border-slate-200'
                            }`}
                        >
                            {/* 這裡保留你原本印出訂單內容與按鈕的程式碼 */}
                        </div>
                    ))}
                </div>
            )}
        </div>

        {/* ================= 下方：已完成獨立區域 ================= */}
        {completedOrders.length > 0 && (
            <div className="border-t pt-6">
                <h3 className="text-lg font-bold text-slate-400 mb-4">已完成歷史訂單 ({completedOrders.length})</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 opacity-70">
                    {completedOrders.map(order => (
                        <div 
                            key={order.firestoreId} 
                            className="bg-white text-slate-800 p-5 shadow-sm border-2 border-slate-200 rounded-2xl"
                        >
                            {/* 已完成的訂單卡片 */}
                        </div>
                    ))}
                </div>
            </div>
        )}
    </div>
)}
          
          {completedOrders.length > 0 && (
    <div className="mt-10 border-t-2 border-slate-200 pt-6">
        <h3 className="text-lg font-bold text-slate-500 mb-4 flex items-center gap-2">
            <span>✅ 已完成歷史訂單</span>
            <span className="text-sm font-normal text-slate-400">({completedOrders.length} 筆)</span>
        </h3>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 opacity-70">
            {completedOrders.map(order => (
                <div 
                    key={order.firestoreId} 
                    className="bg-slate-100 text-slate-600 p-5 shadow-sm border border-slate-300 rounded-2xl"
                >
                    <div className="flex justify-between items-center mb-2 pb-2 border-b border-slate-200">
                        <span className="text-lg font-black bg-slate-300 text-slate-700 px-2.5 py-0.5 rounded-xl font-mono">
                            {order.seq}
                        </span>
                        <span className="text-xs text-slate-400 font-mono">{order.time}</span>
                    </div>
                    <div className="text-xs text-slate-500 mb-2">
                        {order.customerName} ({order.phone})
                    </div>
                    <div className="space-y-1 mb-3">
                        {order.items && order.items.map((it, idx) => (
                            <div key={idx} className="flex justify-between text-xs">
                                <span>{it.name} x1</span>
                                <span>${it.price}</span>
                            </div>
                        ))}
                    </div>
                    <div className="text-xs font-bold text-right text-slate-500 border-t border-slate-200 pt-2">
                        合計金額: ${order.total}
                    </div>
                </div>
            ))}
        </div>
    </div>
)}
          
          {viewMode === 'display' && (
            <div className="space-y-6">
              <div className="bg-slate-900 text-white p-6 rounded-3xl text-center shadow-xl">
                <h2 className="text-3xl font-black text-amber-400 mb-2">📢 園遊會現場叫號看板</h2>
                <p className="text-sm text-slate-400">請憑您的「取餐序號」至攤位領取美味餐點！</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-emerald-500 text-white rounded-3xl p-6 shadow-lg">
                  <h3 className="text-xl font-black mb-4 flex items-center gap-2 border-b border-emerald-400 pb-3">
                    <i className="fa-solid fa-bell animate-bounce"></i> 請來取餐 (Ready)
                  </h3>
                  {readyOrders.length === 0 ? (
                    <p className="text-emerald-100 text-center py-10 font-bold">目前無等候取餐序號</p>
                  ) : (
                    <div className="flex flex-wrap gap-4">
                      {readyOrders.map(o => (
                        <div key={o.firestoreId} className="bg-white text-emerald-700 font-mono font-black text-4xl px-6 py-3 rounded-2xl shadow-md animate-pulse">
                          {o.seq}
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="bg-amber-500 text-white rounded-3xl p-6 shadow-lg">
                  <h3 className="text-xl font-black mb-4 flex items-center gap-2 border-b border-amber-400 pb-3">
                    <i className="fa-solid fa-fire-burner"></i> 準備中 (Preparing)
                  </h3>
                  {preparingOrders.length === 0 ? (
                    <p className="text-amber-100 text-center py-10 font-bold">備餐區順暢中</p>
                  ) : (
                    <div className="flex flex-wrap gap-4">
                      {preparingOrders.map(o => (
                        <div key={o.firestoreId} className="bg-amber-600 text-amber-100 font-mono font-black text-3xl px-5 py-2 rounded-2xl">
                          {o.seq}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {showQrModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 relative text-center">
                <button onClick={() => setShowQrModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                  <i className="fa-solid fa-xmark text-xl"></i>
                </button>
                <h3 className="text-xl font-black text-amber-700">顧客線上點餐 QR Code</h3>
                <p className="text-xs text-slate-500">將此 QR Code 印出放在攤位前供顧客掃碼</p>

                <div className="bg-amber-50 p-6 rounded-2xl border-2 border-dashed border-amber-300 flex justify-center">
                  <div ref={qrRef} className="p-2 bg-white rounded-xl shadow-md"></div>
                </div>

                <button
                  onClick={() => window.print()}
                  className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md"
                >
                  <i className="fa-solid fa-print mr-1"></i> 列印 QR Code 海報
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SellerApp />);
  </script>
</body>
</html>
