<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園遊會線上點餐 - 賣家接單與叫號端</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX (已更新為最新 stable 版) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, updateDoc, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC_ariYuuW3a-DKyO20ZFwbFlvb2SZm_0",
      authDomain: "garden-order-afeab.firebaseapp.com",
      projectId: "garden-order-afeab",
      storageBucket: "garden-order-afeab.firebasestorage.app",
      messagingSenderId: "387401732851",
      appId: "1:387401732851:web:68acf7d633e0fdff079d86",
      measurementId: "G-BWG1EE20BH"
    };

    const appId = firebaseConfig.projectId;
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Firebase 驗證失敗:", err);
      }
    }

    await initAuth();

    window.db = db;
    window.appId = appId;
    window.fs = { collection, onSnapshot, updateDoc, doc, deleteDoc, setDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_MENU = [
      { id: 'p1', name: '甜不辣', icon: '🍢', isSoldOut: false },
      { id: 'p2', name: '高麗菜捲', icon: '🥬', isSoldOut: false },
      { id: 'p3', name: '蛋餃', icon: '🥟', isSoldOut: false },
      { id: 'p4', name: '貢丸', icon: '🍡', isSoldOut: false },
      { id: 'p5', name: '竹輪', icon: '🍥', isSoldOut: false },
      { id: 'p6', name: '豬血糕', icon: '🪵', isSoldOut: false },
      { id: 'p7', name: '蘿蔔', icon: '🥕', isSoldOut: false },
      { id: 'p8', name: '玉米', icon: '🌽', isSoldOut: false },
      { id: 'p9', name: '王子麵', icon: '🍜', isSoldOut: false },
      { id: 'p10', name: '仁甫套餐', icon: '🍱', isSoldOut: false },
      { id: 'p11', name: '呷飽飽套餐', icon: '🍲', isSoldOut: false }
    ];

    function SellerApp() {
      const [viewMode, setViewMode] = useState('orders'); // 'orders' | 'display'
      const [orders, setOrders] = useState([]);
      const [menu, setMenu] = useState(INITIAL_MENU);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showQrModal, setShowQrModal] = useState(false);

      const prevOrderCountRef = useRef(0);
      const qrRef = useRef(null);

      // 播放提示音
      const playBellSound = () => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.6);
        } catch(e) {
          console.log("音效無法播放:", e);
        }
      };

      // 即時監聽 Firebase 訂單與菜單資料
      useEffect(() => {
        if (!window.db || !window.fs) return;

        const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
        const menuRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'menu_status');

        const unsubOrders = window.fs.onSnapshot(ordersRef, (snapshot) => {
          const fetched = snapshot.docs.map(docSnap => ({
            firestoreId: docSnap.id,
            ...docSnap.data()
          }));

          fetched.sort((a, b) => {
            const numA = Number(String(a.seq || '').replace(/\D/g, '')) || 0;
            const numB = Number(String(b.seq || '').replace(/\D/g, '')) || 0;
            return numA - numB;
          });

          if (fetched.length > prevOrderCountRef.current && prevOrderCountRef.current !== 0) {
            playBellSound();
          }
          prevOrderCountRef.current = fetched.length;
          setOrders(fetched);
        }, (err) => console.error("賣家監聽訂單錯誤:", err));

        const unsubMenu = window.fs.onSnapshot(menuRef, (snapshot) => {
          const soldOutMap = {};
          snapshot.docs.forEach(doc => {
            soldOutMap[doc.id] = doc.data().isSoldOut;
          });

          setMenu(prevMenu => prevMenu.map(item => ({
            ...item,
            isSoldOut: soldOutMap[item.id] !== undefined ? soldOutMap[item.id] : false
          })));
        });

        return () => {
          unsubOrders();
          unsubMenu();
        };
      }, [soundEnabled]);

      // 生成 QR Code 彈窗
      useEffect(() => {
        if (showQrModal && qrRef.current) {
          qrRef.current.innerHTML = '';
          const baseUrl = window.location.origin + window.location.pathname.replace('seller.html', 'index.html');
          const customerUrl = `${baseUrl}?role=customer`;
          new QRCode(qrRef.current, {
            text: customerUrl,
            width: 200,
            height: 200,
            colorDark: "#b45309",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }, [showQrModal]);

      // 切換售罄狀態
      const toggleSoldOut = async (itemId) => {
        const targetItem = menu.find(i => i.id === itemId);
        if (!targetItem) return;
        const nextStatus = !targetItem.isSoldOut;

        try {
          const menuDocRef = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'menu_status', itemId);
          await window.fs.setDoc(menuDocRef, { isSoldOut: nextStatus }, { merge: true });
        } catch (err) {
          console.error("更新售罄狀態失敗:", err);
        }
      };

      // 更新訂單狀態
      const updateOrderStatus = async (firestoreId, nextStatus) => {
        if (!window.db || !window.fs || !firestoreId) return;
        try {
          const orderDocRef = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', firestoreId);
          await window.fs.updateDoc(orderDocRef, { status: nextStatus });
        } catch (err) {
          console.error("更新訂單狀態失敗:", err);
        }
      };

      // 清空所有雲端訂單
      const clearAllOrders = async () => {
        if (window.confirm("確定要清空所有雲端訂單嗎？")) {
          try {
            for (const ord of orders) {
              if (ord.firestoreId) {
                const orderDocRef = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', ord.firestoreId);
                await window.fs.deleteDoc(orderDocRef);
              }
            }
          } catch(e) {
            console.error("清空失敗:", e);
          }
        }
      };

      const activeOrders = orders.filter(o => o.status !== 'completed');
      const completedOrders = orders.filter(o => o.status === 'completed');
      const readyOrders = orders.filter(o => o.status === 'ready');
      const grandTotalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6 pb-20">
          <header className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-md border-b-4 border-amber-400 mb-6 gap-4">
            <div className="flex items-center gap-3">
              <span className="text-4xl">🍧</span>
              <div>
                <h1 className="text-2xl font-black text-amber-700">攤位即時接單與叫號系統</h1>
                <p className="text-xs text-slate-500 font-medium">園遊會賣家後台 · 雲端即時同步 · 叫號看板</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => setShowQrModal(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm"
              >
                <i className="fa-solid fa-qrcode"></i> 顧客點餐 QR Code
              </button>

              <div className="flex bg-amber-100 p-1 rounded-xl gap-1">
                <button
                  onClick={() => setViewMode('orders')}
                  className={`px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition-all ${viewMode === 'orders' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}
                >
                  <i className="fa-solid fa-list-check mr-1"></i>接單看板
                </button>
                <button
                  onClick={() => setViewMode('display')}
                  className={`px-3 py-1.5 rounded-lg font-bold text-xs md:text-sm transition-all ${viewMode === 'display' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}
                >
                  <i className="fa-solid fa-bullhorn mr-1"></i>叫號大螢幕
                </button>
              </div>
            </div>
          </header>

          {viewMode === 'orders' && (
            <div className="space-y-6">
              <div className="bg-white p-4 rounded-2xl shadow-md border border-amber-100 flex flex-wrap justify-between items-center gap-4">
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setSoundEnabled(!soundEnabled)}
                    className={`text-xs px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 ${soundEnabled ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-500'}`}
                  >
                    <i className={`fa-solid ${soundEnabled ? 'fa-bell text-amber-600' : 'fa-bell-slash'}`}></i>
                    {soundEnabled ? '新訂單鈴聲：開啟' : '靜音'}
                  </button>
                  <button
                    onClick={clearAllOrders}
                    className="text-xs px-3 py-1.5 rounded-lg font-bold bg-red-50 text-red-600 hover:bg-red-100 transition-all"
                  >
                    <i className="fa-solid fa-trash-can mr-1"></i>重置所有訂單
                  </button>
                </div>

                <div className="flex items-center gap-4">
                  <div className="bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200 text-center">
                    <span className="text-xs text-slate-500 block">今日營業總額</span>
                    <span className="text-lg font-black text-amber-600">${grandTotalRevenue}</span>
                  </div>
                  <div className="bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 text-center">
                    <span className="text-xs text-slate-500 block">待取餐筆數</span>
                    <span className="text-lg font-black text-emerald-600">{readyOrders.length} 筆</span>
                  </div>
                </div>
              </div>

              {/* 餐點售罄控制區 */}
              <div className="bg-white p-5 rounded-2xl shadow-md border border-amber-100 space-y-3">
                <h3 className="text-sm font-black text-slate-700 flex items-center gap-2">
                  <i className="fa-solid fa-utensils text-amber-500"></i> 餐點庫存與售罄管理 (點擊切換下架/上架)
                </h3>
                <div className="flex flex-wrap gap-2">
                  {menu.map(item => (
                    <button
                      key={item.id}
                      onClick={() => toggleSoldOut(item.id)}
                      className={`text-xs font-bold px-3 py-1.5 rounded-xl border transition-all flex items-center gap-1.5 ${
                        item.isSoldOut 
                          ? 'bg-red-500 text-white border-red-600' 
                          : 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'
                      }`}
                    >
                      <span>{item.icon} {item.name}</span>
                      <span className={`px-1 rounded text-[10px] ${item.isSoldOut ? 'bg-red-700 text-white' : 'bg-emerald-200 text-emerald-900'}`}>
                        {item.isSoldOut ? '售罄' : '供應中'}
                      </span>
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <h3 className="text-lg font-bold text-slate-700 mb-4">進行中訂單 ({activeOrders.length})</h3>
                {activeOrders.length === 0 ? (
                  <div className="bg-white p-12 rounded-2xl text-center text-slate-400 shadow-sm border border-slate-100">
                    <p className="text-4xl mb-2">📋</p>
                    <p className="font-bold">目前尚無進行中的訂單，等待顧客下單中...</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {activeOrders.map((order) => {
                      const isPending = order.status === 'pending';
                      const isPreparing = order.status === 'preparing';
                      const isReady = order.status === 'ready';

                      const isSpicy = order.items && order.items.some(item => 
                        item.options && item.options.some(opt => opt.includes('麻辣'))
                      );

                      return (
                        <div 
                          key={order.firestoreId} 
                          className={`p-5 shadow-md border-2 transition-all flex flex-col justify-between rounded-2xl ${
                            isSpicy 
                              ? 'bg-red-50 border-red-300 ring-2 ring-red-100 text-slate-800' 
                              : 'bg-white border-slate-200 text-slate-800'
                          } ${
                            isReady ? '!border-emerald-500 !bg-emerald-50/40' :
                            isPreparing ? '!border-amber-400' : ''
                          }`}
                        >
                          <div>
                            <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                              <span className="text-2xl font-black bg-amber-500 text-white px-3 py-0.5 rounded-xl font-mono">
                                {order.seq}
                              </span>
                              <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                                isReady ? 'bg-emerald-100 text-emerald-700 animate-pulse' :
                                isPreparing ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'
                              }`}>
                                {isReady ? '🔔 請取餐' : isPreparing ? '🍳 製作中' : '⏳ 待處理'}
                              </span>
                            </div>

                            <div className="text-xs text-slate-500 mb-2 font-medium">
                              <div>訂購人：{order.customerName || '貴賓'} ({order.phone || '無電話'})</div>
                              <div>時間：{order.time}</div>
                            </div>

                            <div className="space-y-1.5 mb-4 bg-slate-50/80 p-3 rounded-xl border border-slate-100">
                              {order.items && order.items.map((it, idx) => (
                                <div key={idx} className="flex justify-between text-xs">
                                  <span className="font-bold text-slate-700">
                                    {it.name}
                                    {it.options && it.options.length > 0 && (
                                      <span className={`block text-[10px] font-bold ${it.options.some(o => o.includes('麻辣')) ? 'text-red-600 bg-red-100 px-1.5 py-0.5 rounded mt-0.5 inline-block' : 'text-amber-600 font-normal'}`}>
                                        ({it.options.join(', ')})
                                      </span>
                                    )}
                                  </span>
                                  <span className="font-bold text-slate-600">${it.price}</span>
                                </div>
                              ))}
                              <div className="border-t border-slate-200 pt-1.5 mt-1 flex justify-between text-xs font-black text-amber-700">
                                <span>合計</span>
                                <span>${order.total}</span>
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                            {isPending && (
                              <button
                                onClick={() => updateOrderStatus(order.firestoreId, 'preparing')}
                                className="col-span-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 rounded-xl shadow-sm transition-all"
                              >
                                <i className="fa-solid fa-fire mr-1"></i> 開始製作
                              </button>
                            )}
                            {isPreparing && (
                              <button
                                onClick={() => updateOrderStatus(order.firestoreId, 'ready')}
                                className="col-span-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-2 rounded-xl shadow-sm transition-all"
                              >
                                <i className="fa-solid fa-bell mr-1"></i> 完成餐點 (可取餐)
                              </button>
                            )}
                            {isReady && (
                              <button
                                onClick={() => updateOrderStatus(order.firestoreId, 'completed')}
                                className="col-span-2 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold py-2 rounded-xl shadow-sm transition-all"
                              >
                                <i className="fa-solid fa-check mr-1"></i> 已取餐 (完成)
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {completedOrders.length > 0 && (
                <div className="mt-10 border-t-2 border-slate-200 pt-6">
                  <h3 className="text-lg font-bold text-slate-500 mb-4 flex items-center gap-2">
                    <span>✅ 已完成歷史訂單</span>
                    <span className="text-sm font-normal text-slate-400">({completedOrders.length} 筆)</span>
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 opacity-70">
                    {completedOrders.map((order) => (
                      <div key={order.firestoreId} className="bg-slate-100 text-slate-600 p-5 shadow-sm border border-slate-300 rounded-2xl">
                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-slate-200">
                          <span className="text-lg font-black bg-slate-300 text-slate-700 px-2.5 py-0.5 rounded-xl font-mono">
                            {order.seq}
                          </span>
                          <span className="text-xs text-slate-400 font-mono">{order.time}</span>
                        </div>
                        <div className="text-xs text-slate-500 mb-2">
                          {order.customerName} ({order.phone})
                        </div>
                        <div className="space-y-1 mb-3 bg-white/60 p-2 rounded-lg">
                          {order.items && order.items.map((it, idx) => (
                            <div key={idx} className="flex justify-between text-xs">
                              <span>{it.name}</span>
                              <span>${it.price}</span>
                            </div>
                          ))}
                        </div>
                        <div className="text-xs font-bold text-right text-slate-500 border-t border-slate-200 pt-2">
                          合計金額：${order.total}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {viewMode === 'display' && (
            <div className="bg-slate-900 text-white rounded-3xl p-6 md:p-10 shadow-2xl min-h-[70vh] flex flex-col justify-between">
              <div className="text-center mb-8 border-b border-slate-800 pb-6">
                <h2 className="text-3xl md:text-5xl font-black text-amber-400 tracking-wider">請依序號取餐</h2>
                <p className="text-slate-400 mt-2 text-sm md:text-base">看到您的號碼時，請至攤位出示手機畫面領餐</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 my-auto">
                <div className="bg-emerald-950/60 border-2 border-emerald-500 rounded-3xl p-6 text-center">
                  <h3 className="text-emerald-400 text-2xl font-bold mb-6 flex items-center justify-center gap-2">
                    <span className="animate-bounce">🔔</span> 請取餐 (Ready)
                  </h3>
                  {readyOrders.length === 0 ? (
                    <p className="text-slate-500 text-xl py-10">目前無待取餐號碼</p>
                  ) : (
                    <div className="flex flex-wrap justify-center gap-4">
                      {readyOrders.map(o => (
                        <span key={o.firestoreId} className="text-4xl md:text-6xl font-black bg-emerald-500 text-white px-6 py-3 rounded-2xl shadow-lg font-mono animate-pulse">
                          {o.seq}
                        </span>
                      ))}
                    </div>
                  )}
                </div>

                <div className="bg-amber-950/40 border-2 border-amber-500/40 rounded-3xl p-6 text-center">
                  <h3 className="text-amber-400 text-2xl font-bold mb-6">🍳 備餐中 (Preparing)</h3>
                  {activeOrders.filter(o => o.status === 'preparing' || o.status === 'pending').length === 0 ? (
                    <p className="text-slate-500 text-xl py-10">無製作中餐點</p>
                  ) : (
                    <div className="flex flex-wrap justify-center gap-3">
                      {activeOrders.filter(o => o.status === 'preparing' || o.status === 'pending').map(o => (
                        <span key={o.firestoreId} className="text-2xl md:text-4xl font-bold bg-slate-800 text-amber-300 px-4 py-2 rounded-xl font-mono border border-slate-700">
                          {o.seq}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <div className="text-center text-slate-500 text-xs mt-8">
                園遊會現場實時叫號系統 · 每秒自動更新
              </div>
            </div>
          )}

          {showQrModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-lg text-slate-800">顧客點餐 QR Code</h3>
                  <button onClick={() => setShowQrModal(false)} className="text-slate-400 hover:text-slate-600 text-xl">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-500">讓顧客掃描此 QR Code 即可進行點餐</p>
                <div className="flex justify-center p-4 bg-amber-50 rounded-2xl border border-amber-200">
                  <div ref={qrRef}></div>
                </div>
                <button
                  onClick={() => window.print()}
                  className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-sm transition-all"
                >
                  <i className="fa-solid fa-print mr-1.5"></i> 列印 QR Code
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SellerApp />);
  </script>
</body>
</html>
