<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡樂園遊會線上點餐與接單系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC_ariYuuW3a-DKyO20ZFwbFlvb2SZm_0",
      authDomain: "garden-order-afeab.firebaseapp.com",
      projectId: "garden-order-afeab",
      storageBucket: "garden-order-afeab.firebasestorage.app",
      messagingSenderId: "387401732851",
      appId: "1:387401732851:web:68acf7d633e0fdff079d86",
      measurementId: "G-BWG1EE20BH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth).catch(err => console.error("Firebase 匿名登入失敗:", err));

    window.db = db;
    window.appId = firebaseConfig.projectId;
    window.fs = { collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, getDocs, setDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_MENU = [
      { id: 'p1', name: '甜不辣', category: '關東煮', price: 25, icon: '🍢', desc: '1個 / 口感Q彈入味。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p2', name: '高麗菜捲', category: '蔬菜', price: 40, icon: '🥬', desc: '1個 / 清甜高麗菜包裹肉餡。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p3', name: '蛋餃', category: '關東煮', price: 35, icon: '🥟', desc: '2個 / 金黃蛋皮包覆內餡。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p4', name: '貢丸', category: '關東煮', price: 35, icon: '🍡', desc: '3個 / 紮實彈牙。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p5', name: '竹輪', category: '關東煮', price: 35, icon: '🍥', desc: '2個 / 吸飽湯汁超入味。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p6', name: '豬血糕', category: '關東煮', price: 25, icon: '🪵', desc: '1個 / 軟糯入味。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p7', name: '蘿蔔', category: '蔬菜', price: 20, icon: '🥕', desc: '1個 / 燉煮至透亮綿密。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p8', name: '玉米', category: '蔬菜', price: 25, icon: '🌽', desc: '1個 / 鮮甜金黃玉米。', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p9', name: '王子麵', category: '主食', price: 25, icon: '🍜', desc: '1個 / 填飽肚子首選！', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p10', name: '仁甫套餐', category: '套餐', price: 75, icon: '🍱', desc: '高麗菜捲*1 + 蘿蔔*1 + 玉米*1', options: ['原味高湯', '麻辣湯底'], isSoldOut: false },
      { id: 'p11', name: '呷飽飽套餐', category: '套餐', price: 150, icon: '🍲', desc: '貢丸*3 + 蛋餃*2 + 玉米*1 + 高麗菜捲*1 + 王子麵*1', options: ['原味高湯', '麻辣湯底'], isSoldOut: false }
    ];

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const isCustomerUrl = urlParams.get('role') === 'customer';

      const [view, setView] = useState('customer');
      const [menu, setMenu] = useState(INITIAL_MENU);
      const [cart, setCart] = useState([]);
      const [orders, setOrders] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('全部');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [activeOrder, setActiveOrder] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedOptions, setSelectedOptions] = useState([]);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showQrModal, setShowQrModal] = useState(false);
      const [customerUrl, setCustomerUrl] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const prevOrderCountRef = useRef(0);
      const qrRef = useRef(null);

      useEffect(() => {
        const baseUrl = window.location.origin + window.location.pathname;
        setCustomerUrl(`${baseUrl}?role=customer`);
      }, []);

      useEffect(() => {
        if (showQrModal && qrRef.current) {
          qrRef.current.innerHTML = '';
          new QRCode(qrRef.current, {
            text: customerUrl,
            width: 200,
            height: 200,
            colorDark: "#b45309",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }, [showQrModal, customerUrl]);

      const playBellSound = () => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.6);
        } catch(e) {}
      };

      useEffect(() => {
        if (!window.db || !window.fs) return;
        const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
        const menuRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'menu_status');

        const unsubOrders = window.fs.onSnapshot(ordersRef, (snapshot) => {
          const fetched = snapshot.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
          fetched.sort((a, b) => (Number(a.seq?.replace(/\D/g,'')) || 0) - (Number(b.seq?.replace(/\D/g,'')) || 0));

          if (fetched.length > prevOrderCountRef.current && prevOrderCountRef.current !== 0) {
            playBellSound();
          }
          prevOrderCountRef.current = fetched.length;
          setOrders(fetched);
        });

        const unsubMenu = window.fs.onSnapshot(menuRef, (snapshot) => {
          const map = {};
          snapshot.docs.forEach(doc => { map[doc.id] = doc.data().isSoldOut; });
          setMenu(prev => prev.map(item => ({ ...item, isSoldOut: map[item.id] !== undefined ? map[item.id] : false })));
        });

        return () => { unsubOrders(); unsubMenu(); };
      }, [soundEnabled]);

      const toggleSoldOut = async (itemId) => {
        if (!window.db || !window.fs) return;
        const target = menu.find(i => i.id === itemId);
        if (!target) return;
        try {
          const ref = window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'menu_status', itemId);
          await window.fs.setDoc(ref, { isSoldOut: !target.isSoldOut }, { merge: true });
        } catch (e) { console.error(e); }
      };

      const openOptionModal = (item) => {
        if (item.isSoldOut) return;
        setSelectedItem(item);
        setSelectedOptions([item.options[0]]);
      };

      const addToCart = () => {
        if (!selectedItem) return;
        setCart([...cart, { cartId: Date.now() + Math.random(), ...selectedItem, options: [...selectedOptions] }]);
        setSelectedItem(null);
      };

      const submitOrder = async (e) => {
        e.preventDefault();
        if (cart.length === 0 || isSubmitting) return;
        setIsSubmitting(true);
        try {
          const ordersRef = window.fs.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'orders');
          const snapshot = await window.fs.getDocs(ordersRef);
          const seq = '#' + String(snapshot.size + 1).padStart(3, '0');
          const newOrder = {
            id: 'ORD-' + Date.now().toString().slice(-4),
            seq,
            customerName: customerName || '貴賓',
            phone: customerPhone || '未提供',
            items: cart,
            total: cart.reduce((s, i) => s + i.price, 0),
            status: 'pending',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            createdAt: Date.now()
          };
          const docRef = await window.fs.addDoc(ordersRef, newOrder);
          setActiveOrder({ ...newOrder, firestoreId: docRef.id });
          setCart([]);
        } catch (err) {
          console.error(err);
          alert("送出失敗");
        } finally {
          setIsSubmitting(false);
        }
      };

      const updateStatus = async (firestoreId, nextStatus) => {
        try {
          await window.fs.updateDoc(window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', firestoreId), { status: nextStatus });
        } catch (e) { console.error(e); }
      };

      const clearOrders = async () => {
        if (window.confirm("確定清空所有訂單嗎？")) {
          try {
            for (const o of orders) {
              await window.fs.deleteDoc(window.fs.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'orders', o.firestoreId));
            }
          } catch(e) { console.error(e); }
        }
      };

      const readyOrders = orders.filter(o => o.status === 'ready');
      const preparingOrders = orders.filter(o => o.status === 'preparing' || o.status === 'pending');

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6 pb-20">
          <header className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-md border-b-4 border-amber-400 mb-6 gap-4">
            <div className="flex items-center gap-3">
              <span className="text-4xl animate-bounce">🍢</span>
              <div>
                <h1 className="text-xl md:text-2xl font-black text-amber-700">歡樂園遊會線上點餐系統</h1>
                <p className="text-xs text-slate-500 font-medium">免桌號 ‧ 掃碼點餐 ‧ 專屬序號取餐</p>
              </div>
            </div>

            {!isCustomerUrl && (
              <div className="flex flex-wrap items-center gap-2">
                <button onClick={() => setShowQrModal(true)} className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5">
                  <i className="fa-solid fa-qrcode"></i> 攤位點餐 QR Code
                </button>
                <div className="flex bg-amber-100 p-1 rounded-xl gap-1">
                  <button onClick={() => setView('customer')} className={`px-3 py-1.5 rounded-lg font-bold text-xs ${view === 'customer' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}>顧客點餐區</button>
                  <button onClick={() => setView('kitchen')} className={`px-3 py-1.5 rounded-lg font-bold text-xs ${view === 'kitchen' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}>賣家接單端</button>
                  <button onClick={() => setView('display')} className={`px-3 py-1.5 rounded-lg font-bold text-xs ${view === 'display' ? 'bg-amber-500 text-white shadow' : 'text-amber-800'}`}>叫號看板</button>
                </div>
              </div>
            )}
          </header>

          {(view === 'customer' || isCustomerUrl) && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="md:col-span-2 space-y-4">
                <div className="flex gap-2 overflow-x-auto pb-2">
                  {['全部', '主食', '關東煮', '蔬菜', '套餐'].map(cat => (
                    <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? 'bg-amber-500 text-white shadow' : 'bg-white text-slate-600'}`}>{cat}</button>
                  ))}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {menu.filter(i => selectedCategory === '全部' || i.category === selectedCategory).map(item => (
                    <div key={item.id} className={`bg-white p-4 rounded-2xl border flex flex-col justify-between ${item.isSoldOut ? 'opacity-60 bg-slate-100' : 'border-amber-100'}`}>
                      <div>
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-3xl">{item.icon}</span>
                          <span className="font-extrabold text-amber-600">${item.price}</span>
                        </div>
                        <h3 className="font-bold text-slate-800 text-sm">{item.name} {item.isSoldOut && <span className="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full">已售罄</span>}</h3>
                        <p className="text-[11px] text-slate-400 mt-1">{item.desc}</p>
                      </div>
                      <button disabled={item.isSoldOut} onClick={() => openOptionModal(item)} className="mt-3 w-full bg-amber-500 disabled:bg-slate-300 text-white text-xs font-bold py-2 rounded-xl shadow">
                        {item.isSoldOut ? '已售罄' : '選擇湯底選購'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl shadow-md border-2 border-amber-200">
                  <h2 className="font-black text-sm text-slate-800 mb-3 flex items-center gap-2">
                    <i className="fa-solid fa-basket-shopping text-amber-500"></i> 已選購餐點 ({cart.length})
                  </h2>
                  {cart.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-6">購物車是空的，快加入美食吧！</p>
                  ) : (
                    <div className="space-y-2 max-h-48 overflow-y-auto">
                      {cart.map(i => (
                        <div key={i.cartId} className="flex justify-between items-center text-xs bg-amber-50 p-2 rounded-xl">
                          <div>
                            <div className="font-bold">{i.icon} {i.name}</div>
                            <div className="text-[10px] text-amber-700">[{i.options.join('/')}]</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-amber-600">${i.price}</span>
                            <button onClick={() => setCart(cart.filter(x => x.cartId !== i.cartId))} className="text-slate-300 hover:text-red-500"><i className="fa-solid fa-xmark"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                  {cart.length > 0 && (
                    <form onSubmit={submitOrder} className="mt-3 space-y-2 pt-3 border-t">
                      <input type="text" placeholder="您的稱呼 (例: 王小明)" value={customerName} onChange={e => setCustomerName(e.target.value)} required className="w-full text-xs p-2 border rounded-xl" />
                      <input type="tel" placeholder="手機末三碼 (例: 888)" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} required className="w-full text-xs p-2 border rounded-xl" />
                      <button type="submit" disabled={isSubmitting} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-2.5 rounded-xl text-xs shadow">
                        {isSubmitting ? '傳送中...' : '送出訂單'}
                      </button>
                    </form>
                  )}
                </div>
                {activeOrder && (
                  <div className="bg-amber-500 text-white p-4 rounded-2xl shadow-lg">
                    <div className="text-xs bg-amber-700/60 px-2 py-1 rounded font-mono inline-block mb-1">您的取餐序號</div>
                    <div className="text-2xl font-mono font-black">{activeOrder.seq}</div>
                    <div className="text-xs mt-1">狀態：{activeOrder.status === 'ready' ? '🔔 請取餐！' : '⏳ 備餐中'}</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {view === 'kitchen' && !isCustomerUrl && (
            <div className="space-y-6">
              <div className="bg-white p-4 rounded-2xl shadow-md flex flex-wrap justify-between items-center gap-4">
                <div className="flex gap-2">
                  <button onClick={() => setSoundEnabled(!soundEnabled)} className={`text-xs px-3 py-1.5 rounded-xl font-bold ${soundEnabled ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-400'}`}>
                    <i className="fa-solid fa-bell mr-1"></i> 新訂單提示音：{soundEnabled ? '開啟' : '靜音'}
                  </button>
                  <button onClick={clearOrders} className="text-xs px-3 py-1.5 rounded-xl font-bold bg-red-50 text-red-600 hover:bg-red-100">
                    <i className="fa-solid fa-trash-can mr-1"></i> 重置訂單
                  </button>
                </div>
                <div className="flex gap-3">
                  <div className="bg-amber-50 px-3 py-1.5 rounded-xl border text-center">
                    <span className="text-[10px] text-slate-500 block">今日營業額</span>
                    <span className="text-sm font-black text-amber-600">${orders.reduce((s, o) => s + (o.total || 0), 0)}</span>
                  </div>
                  <div className="bg-emerald-50 px-3 py-1.5 rounded-xl border text-center">
                    <span className="text-[10px] text-slate-500 block">待取餐筆數</span>
                    <span className="text-sm font-black text-emerald-600">{readyOrders.length} 筆</span>
                  </div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-md space-y-2">
                <h3 className="text-xs font-black text-slate-700">🛠️ 餐點庫存與售罄管理 (點擊按鈕一鍵切換)</h3>
                <div className="flex flex-wrap gap-2">
                  {menu.map(item => (
                    <button key={item.id} onClick={() => toggleSoldOut(item.id)} className={`text-xs font-bold px-3 py-1.5 rounded-xl border transition-all ${item.isSoldOut ? 'bg-red-500 text-white' : 'bg-emerald-50 text-emerald-700'}`}>
                      {item.icon} {item.name}：{item.isSoldOut ? '已售罄 (點此上架)' : '供應中 (點此售罄)'}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {orders.map(order => {
                  const isSpicy = order.items && order.items.some(it => it.options && it.options.some(opt => opt.includes('麻辣')));
                  return (
                    <div key={order.firestoreId} className={`p-4 rounded-2xl shadow-md border-2 ${isSpicy ? 'bg-red-50 border-red-300 ring-2 ring-red-100' : 'bg-white border-slate-200'} ${order.status === 'ready' ? '!border-emerald-500 !bg-emerald-50/40' : ''}`}>
                      <div className="flex justify-between items-center mb-2 pb-2 border-b">
                        <span className="text-lg font-black bg-amber-500 text-white px-2.5 py-0.5 rounded-xl font-mono">{order.seq}</span>
                        <span className="text-xs text-slate-400">{order.time}</span>
                      </div>
                      <div className="text-xs font-bold text-slate-700 mb-2">{order.customerName} ({order.phone})</div>
                      <div className="space-y-1 mb-3 bg-slate-50 p-2 rounded-xl text-xs">
                        {order.items?.map((it, idx) => (
                          <div key={idx} className="flex justify-between items-start">
                            <div>
                              <span className="font-bold">{it.icon} {it.name}</span>
                              {it.options && (
                                <span className={`block text-[10px] font-bold ${it.options.some(o => o.includes('麻辣')) ? 'text-red-600 bg-red-100 px-1.5 py-0.5 rounded mt-0.5 inline-block' : 'text-amber-700'}`}>
                                  ({it.options.join(', ')})
                                </span>
                              )}
                            </div>
                            <span className="font-bold">${it.price}</span>
                          </div>
                        ))}
                        <div className="border-t pt-1 flex justify-between font-black text-amber-600">
                          <span>合計</span>
                          <span>${order.total}</span>
                        </div>
                      </div>
                      <div className="grid grid-cols-3 gap-1">
                        <button onClick={() => updateStatus(order.firestoreId, 'preparing')} className={`text-[11px] font-bold py-1.5 rounded-lg ${order.status === 'preparing' ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}>製作中</button>
                        <button onClick={() => updateStatus(order.firestoreId, 'ready')} className={`text-[11px] font-bold py-1.5 rounded-lg ${order.status === 'ready' ? 'bg-emerald-500 text-white animate-bounce' : 'bg-slate-100 text-slate-600'}`}>可取餐</button>
                        <button onClick={() => updateStatus(order.firestoreId, 'completed')} className={`text-[11px] font-bold py-1.5 rounded-lg ${order.status === 'completed' ? 'bg-slate-400 text-white' : 'bg-slate-100 text-slate-600'}`}>完成</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {view === 'display' && !isCustomerUrl && (
            <div className="bg-slate-900 text-white rounded-3xl p-6 md:p-10 shadow-2xl min-h-[65vh] flex flex-col justify-between">
              <div className="text-center mb-6 border-b border-slate-800 pb-4">
                <h2 className="text-3xl md:text-4xl font-black text-amber-400">📢 園遊會現場叫號看板</h2>
                <p className="text-slate-400 text-xs md:text-sm mt-1">請憑取餐序號至攤位領取美食</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
                <div className="bg-emerald-950/60 border-2 border-emerald-500 rounded-2xl p-5 text-center">
                  <h3 className="text-emerald-400 text-xl font-bold mb-4 flex items-center justify-center gap-2">
                    <span className="animate-bounce">🔔</span> 請取餐 (Ready)
                  </h3>
                  {readyOrders.length === 0 ? (
                    <p className="text-slate-500 text-sm py-6">目前無待取餐號碼</p>
                  ) : (
                    <div className="flex flex-wrap justify-center gap-3">
                      {readyOrders.map(o => (
                        <span key={o.firestoreId} className="text-4xl md:text-5xl font-black bg-emerald-500 text-white px-5 py-2 rounded-2xl font-mono animate-pulse">{o.seq}</span>
                      ))}
                    </div>
                  )}
                </div>
                <div className="bg-amber-950/40 border-2 border-amber-500/40 rounded-2xl p-5 text-center">
                  <h3 className="text-amber-400 text-xl font-bold mb-4">🍳 備餐中 (Preparing)</h3>
                  {preparingOrders.length === 0 ? (
                    <p className="text-slate-500 text-sm py-6">備餐區順暢中</p>
                  ) : (
                    <div className="flex flex-wrap justify-center gap-2">
                      {preparingOrders.map(o => (
                        <span key={o.firestoreId} className="text-2xl md:text-3xl font-bold bg-slate-800 text-amber-300 px-3 py-1.5 rounded-xl font-mono">{o.seq}</span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {showQrModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-3 shadow-2xl relative">
                <button onClick={() => setShowQrModal(false)} className="absolute top-3 right-3 text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                <h3 className="text-lg font-bold text-amber-700">📱 顧客點餐 QR Code</h3>
                <p className="text-xs text-slate-500">掃描此 QR Code 即可進入點餐頁面</p>
                <div className="flex justify-center p-3 bg-amber-50 rounded-2xl border border-amber-200">
                  <div ref={qrRef}></div>
                </div>
                <button onClick={() => setShowQrModal(false)} className="w-full bg-amber-500 text-white font-bold py-2 rounded-xl text-xs">關閉視窗</button>
              </div>
            </div>
          )}

          {selectedItem && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">{selectedItem.icon}</span>
                    <h3 className="font-extrabold text-sm text-slate-800">{selectedItem.name}</h3>
                  </div>
                  <button onClick={() => setSelectedItem(null)} className="text-slate-400"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-2">選擇湯底：</label>
                  <div className="flex gap-2">
                    {selectedItem.options.map(opt => (
                      <button key={opt} onClick={() => setSelectedOptions([opt])} className={`px-3 py-1.5 text-xs rounded-xl font-bold border ${selectedOptions.includes(opt) ? 'bg-amber-500 text-white border-amber-500' : 'bg-slate-50 text-slate-600'}`}>{opt}</button>
                    ))}
                  </div>
                </div>
                <div className="pt-2 border-t flex justify-between items-center">
                  <span className="font-black text-xl text-amber-600">${selectedItem.price}</span>
                  <button onClick={addToCart} className="bg-amber-500 text-white font-bold px-4 py-2 rounded-xl text-xs">加入購物車</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
